<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦乡分享抽奖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            position: relative;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.2em;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 1em;
            margin-bottom: 30px;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wheel-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 20px 0;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
        }

        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            border: 5px solid white;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            line-height: 1.3;
        }

        .center-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .center-button:disabled {
            background: linear-gradient(135deg, #ccc 0%, #aaa 100%);
            cursor: not-allowed;
            transform: translate(-50%, -50%);
        }

        .result-display {
            text-align: center;
            margin-top: 24px;
            padding: 20px 30px;
            background: linear-gradient(135deg, #fff9c4, #ffe082);
            border: 2px solid #f9a825;
            border-radius: 14px;
            font-size: 1.3em;
            font-weight: bold;
            color: #6d4c00;
            display: none;
            box-shadow: 0 4px 15px rgba(249, 168, 37, 0.3);
        }

        .result-display.show {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0%   { opacity: 0; transform: scale(0.6); }
            80%  { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .result-display .prize-name {
            display: block;
            font-size: 1.2em;
            color: #e65100;
            margin-top: 6px;
        }

        .prize-info {
            margin-top: 24px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border: 2px solid #66bb6a;
            border-radius: 14px;
            padding: 18px 24px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .prize-info .info-title {
            font-size: 1em;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .prize-info .info-body {
            font-size: 1.1em;
            color: #1b5e20;
            font-weight: bold;
        }

        .prize-info .info-prob {
            margin-top: 6px;
            font-size: 0.9em;
            color: #388e3c;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 1.6em;
            }

            .wheel-container {
                width: 300px;
                height: 300px;
            }

            .center-button {
                width: 64px;
                height: 64px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 梦乡分享抽奖</h1>
        <p class="subtitle">参与即有奖，100% 中奖！</p>

        <div class="content">
            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="pointer"></div>
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                    <button class="center-button" id="startBtn">开始<br>抽奖</button>
                </div>

                <div class="result-display" id="result">
                    🎉 恭喜您获得：
                    <span class="prize-name">苏教练免费陪练1小时</span>
                </div>

                <div class="prize-info">
                    <div class="info-title">🏆 本次奖品</div>
                    <div class="info-body">苏教练免费陪练 1 小时</div>
                    <div class="info-prob">✅ 中奖概率：100%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ 预加载音频文件，与 lottery.html 同目录 -->
    <audio id="lotterySound" preload="auto">
        <source src="sound.mp4" type="video/mp4">
    </audio>

    <script>
        class LotteryWheel {
            constructor() {
                this.canvas         = document.getElementById('wheelCanvas');
                this.ctx            = this.canvas.getContext('2d');
                this.startBtn       = document.getElementById('startBtn');
                this.resultDisplay  = document.getElementById('result');
                // ✅ 获取音频元素
                this.sound          = document.getElementById('lotterySound');

                this.duration        = 5000;
                this.isSpinning      = false;
                this.currentRotation = 0;

                this.init();
            }

            init() {
                this.drawWheel();
                this.bindEvents();
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.spin());
            }

            // ✅ 播放抽奖音效，支持重复点击时从头播放
            playSound() {
                try {
                    this.sound.currentTime = 0; // 每次从头播放
                    this.sound.play().catch(err => {
                        console.warn('音频播放失败（可能需要用户交互授权）：', err);
                    });
                } catch (err) {
                    console.warn('音频操作出错：', err);
                }
            }

            drawWheel() {
                const canvas = this.canvas;
                const ctx    = this.ctx;
                const cx     = canvas.width  / 2;
                const cy     = canvas.height / 2;
                const radius = canvas.width  / 2 - 10;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                /* ── 渐变背景圆 ── */
                const grad = ctx.createRadialGradient(cx, cy, radius * 0.1, cx, cy, radius);
                grad.addColorStop(0, '#FF8E8E');
                grad.addColorStop(1, '#C0392B');
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = grad;
                ctx.fill();

                /* ── 奖品文字：分两行，整体偏上，远离圆心按钮 ── */
                const textCenterY = cy - 80;

                ctx.save();
                ctx.fillStyle    = '#FFFFFF';
                ctx.textAlign    = 'center';
                ctx.textBaseline = 'middle';
                ctx.font         = 'bold 34px Arial';
                ctx.shadowColor  = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur   = 6;
                ctx.fillText('苏教练', cx, textCenterY - 22);

                ctx.font = 'bold 26px Arial';
                ctx.fillText('免费陪练1小时', cx, textCenterY + 22);
                ctx.restore();

                /* ── 外圈金色描边 ── */
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth   = 8;
                ctx.stroke();

                /* ── 外圈交替小圆点 ── */
                const dotCount = 24;
                for (let i = 0; i < dotCount; i++) {
                    const angle = (i / dotCount) * 2 * Math.PI;
                    const dx = cx + Math.cos(angle) * radius;
                    const dy = cy + Math.sin(angle) * radius;
                    ctx.beginPath();
                    ctx.arc(dx, dy, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = i % 2 === 0 ? '#FFD700' : '#FF4757';
                    ctx.fill();
                }
            }

            spin() {
                if (this.isSpinning) return;

                this.isSpinning = true;
                this.startBtn.disabled = true;
                this.resultDisplay.classList.remove('show');

                // ✅ 点击抽奖按钮时立即播放音效
                this.playSound();

                const extraDeg  = 30 + Math.random() * 300;
                const totalDeg  = 5 * 360 + extraDeg;
                this.currentRotation += totalDeg;

                this.canvas.style.transition = `transform ${this.duration}ms cubic-bezier(0.25, 0.1, 0.25, 1)`;
                this.canvas.style.transform  = `rotate(${this.currentRotation}deg)`;

                setTimeout(() => {
                    this.resultDisplay.classList.add('show');
                    this.isSpinning        = false;
                    this.startBtn.disabled = false;

                    const normalized = this.currentRotation % 360;
                    this.canvas.style.transition = 'none';
                    this.canvas.style.transform  = `rotate(${normalized}deg)`;
                    this.currentRotation = normalized;

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            this.canvas.style.transition =
                                `transform ${this.duration}ms cubic-bezier(0.25, 0.1, 0.25, 1)`;
                        });
                    });
                }, this.duration);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new LotteryWheel();
        });
    </script>
</body>
</html>
